<body data-header="flow" data-steps="4" data-step="2" data-page="musthaves">
<header id="site-header"></header>
<main class="container step-page">
  <section class="step-main">
    <div class="stack-sm">
      <span class="kicker">Step 2 of 4</span>
      <h1>What can't you live without?</h1>
      <p class="lede">Tap what matters. Your matches update as you go.</p>
    </div>
    <div class="stack-sm">
      <strong style="font-size:14px">Must-haves</strong>
      <div class="chips" id="must-chips"></div>
    </div>
    <div class="stack-sm">
      <strong style="font-size:14px">Who's moving in?</strong>
      <div class="chips" id="who-chips"></div>
    </div>
    <div class="actions">
      <a class="btn btn-primary" id="to-matches" href="matches.html">See my matches</a>
      <a href="index.html">Back</a>
    </div>
  </section>
  <aside class="step-side panel" aria-live="polite">
    <div><span class="big-number" id="match-count">–</span> <span style="color:var(--muted)">homes match so far</span></div>
    <div class="meter"><span id="match-meter" style="width:0"></span></div>
    <div class="stack-sm" id="match-preview"></div>
  </aside>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

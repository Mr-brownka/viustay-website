<body data-no-launch data-no-lang data-header="flow" data-steps="0" data-no-wa data-no-looks data-home="agent.html">
<header id="site-header"></header>

<main class="auth-box hidden" id="g-auth">
  <h1 style="font-size:32px" id="g-auth-title">Agent log in</h1>
  <p class="lede" style="font-size:16px">For Viustay agents. Use the email Viustay registered for you.</p>
  <form id="g-form" class="stack-sm" novalidate data-guide>
    <label class="field">Email<input type="email" name="email" autocomplete="email"></label>
    <label class="field">Password<input type="password" name="password" autocomplete="current-password"></label>
    <p class="error hidden" id="g-error" role="alert"></p>
    <p class="t-msg ok hidden" id="g-ok"></p>
    <button type="submit" class="btn btn-dark" id="g-submit">Log in</button>
  </form>
  <p class="note"><a href="#" id="g-switch">First time? Create your password</a></p>
</main>

<main class="auth-box hidden" id="g-denied">
  <h1 style="font-size:28px">This login isn't linked to an agent</h1>
  <p>Ask Viustay to add your email to the agents list, then log in again.</p>
  <button type="button" class="btn btn-outline" id="g-out2">Log out</button>
</main>

<main class="container hidden" id="g-dash" style="max-width:760px;padding-top:24px;padding-bottom:60px;display:flex;flex-direction:column;gap:18px">
  <div class="row-between" style="flex-wrap:wrap;gap:10px">
    <div class="stack-sm" style="gap:2px"><span class="kicker">Viustay agent</span><h1 style="font-size:30px" id="g-hello">Hello</h1></div>
    <div class="t-actions"><button type="button" class="btn btn-outline" id="g-refresh">Refresh</button><button type="button" class="btn btn-outline" id="g-out">Log out</button></div>
  </div>
  <div class="t-sum" id="g-sum"></div>
  <div class="t-tabs" role="group" aria-label="Sections">
    <button type="button" class="chip" data-g="trips" aria-pressed="true">Trips</button>
    <button type="button" class="chip" data-g="pay" aria-pressed="false">My pay</button>
  </div>
  <p class="error hidden" id="g-load-error" role="alert"></p>
  <div id="g-list" class="stack-sm" style="gap:14px"></div>
</main>

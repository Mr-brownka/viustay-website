<body data-header="main" data-no-wa>
<header id="site-header"></header>
<main class="container section mb-page">
  <div class="mb-head">
    <h1 data-i18n>My bookings</h1>
    <button type="button" class="mb-link" id="find-again" data-i18n>Find a booking</button>
  </div>
  <form class="t-card hidden" id="find-form" novalidate>
    <p style="margin:0" data-i18n>Enter your booking number and the phone number you booked with.</p>
    <div class="grid-2">
      <label class="field"><span data-i18n>Booking number</span><input type="text" name="ref" placeholder="VS-XXXXXX / ST-XXXXXX" autocapitalize="characters"></label>
      <label class="field"><span data-i18n>Phone number</span><input type="tel" name="phone" placeholder="07XX XXX XXX"></label>
    </div>
    <p class="error hidden" id="find-error" role="alert"></p>
    <div><button type="submit" class="btn btn-primary" data-i18n>Find my booking</button></div>
  </form>
  <div id="trip-view" class="stack-sm hidden" style="gap:28px"></div>
</main>

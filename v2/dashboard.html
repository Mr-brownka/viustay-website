<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manager dashboard | Viustay</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Viustay">
<meta property="og:title" content="Manager dashboard | Viustay">
<meta property="og:description" content="Tell us what you need and we shortlist verified homes in Nairobi, then take you to view them in one trip.">
<meta property="og:url" content="https://mr-brownka.github.io/viustay-website/v2/dashboard.html">
<meta property="og:image" content="https://mr-brownka.github.io/viustay-website/assets/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FAFBFA">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Viustay">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap">
<link rel="stylesheet" href="css/styles.css?v=12">
<link rel="stylesheet" href="css/glass.css?v=12">
<link rel="stylesheet" href="css/manager.css?v=12">
<script src="js/look.js"></script>
</head>
<body data-no-launch data-no-lang data-header="flow" data-steps="0" data-home="owners.html" data-no-wa data-no-looks>
<header id="site-header"></header>

<!-- Log in / sign up -->
<main class="auth-box hidden" id="auth">
  <h1 id="auth-title" style="font-size:32px">Manager log in</h1>
  <p class="lede" style="font-size:16px" id="auth-lede">Register your buildings, add vacancies and see every viewing.</p>
  <form id="auth-form" class="stack-sm" novalidate>
    <label class="field">Email<input type="email" name="email" autocomplete="email" required></label>
    <label class="field" id="pw-field">Password<input type="password" name="password" autocomplete="current-password" minlength="8" required></label>
    <p class="error hidden" id="auth-error" role="alert"></p>
    <p class="note hidden" id="auth-info" role="status" style="font-size:15px;color:var(--emerald);font-weight:600"></p>
    <button type="submit" class="btn btn-dark" id="auth-submit">Log in</button>
  </form>
  <div class="actions" style="font-size:15px;gap:6px 16px">
    <button type="button" class="btn-link" id="toggle-mode">New here? Create a login</button>
    <button type="button" class="btn-link" id="forgot">Forgot password?</button>
  </div>
  <p class="note">Use the same email you gave us when listing your building, so your units show up automatically.</p>
</main>

<!-- Dashboard -->
<div class="md hidden" id="dash">
  <aside class="md-side" aria-label="Dashboard">
    <a class="md-logo" href="owners.html"><img src="assets/viustay-logo-white.svg" alt="Viustay"><span>owners</span></a>
    <nav class="md-nav">
      <button type="button" data-go="buildings"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M10 21v-4h4v4"/></svg><span data-i18n>My buildings</span></button>
      <div class="md-sub" id="side-sub"></div>
      <button type="button" data-go="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span data-i18n>Profile &amp; settings</span></button>
    </nav>
    <div class="md-soon">
      <small data-i18n>Coming soon</small><b>Viustay Manage</b>
      <span data-i18n>Rent collection</span><span data-i18n>Tenants &amp; leases</span><span data-i18n>Repairs</span>
    </div>
    <div class="md-me"><span class="md-av" id="me-av-side">··</span><span><b id="me-name-side"></b><button type="button" class="md-out" data-logout data-i18n>Log out</button></span></div>
  </aside>
  <header class="md-top">
    <span id="md-top-left"></span>
    <button type="button" class="md-av" id="me-av-top" data-go="profile" aria-label="Profile and settings">··</button>
  </header>
  <main class="md-main" id="md-view"></main>
  <nav class="md-tabs" aria-label="Building">
    <button type="button" data-btab="home"><i><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></i><span data-i18n>Home</span></button>
    <button type="button" data-btab="units"><i><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M10 21v-4h4v4"/></svg></i><span data-i18n>Units</span></button>
    <button type="button" data-btab="viewings"><i><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></i><span data-i18n>Viewings</span></button>
    <button type="button" data-btab="details"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></i><span data-i18n>Details</span></button>
  </nav>
</div>
<div class="md-sheet hidden" id="sheet" role="dialog" aria-modal="true"><div class="md-sheet-card" id="sheet-card"></div></div>
<div class="md-toast hidden" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/lang.js?v=12"></script>
<script src="js/i18n.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js?v=12"></script>
<script src="js/install.js"></script>
<script src="js/dashboard.js?v=12"></script>
</body>
</html>

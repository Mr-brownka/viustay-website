<body data-header="main">
<header id="site-header"></header>
<main class="container section" style="max-width:720px;display:flex;flex-direction:column;gap:20px">
  <div class="stack-sm">
    <span class="kicker">Viewing trip</span>
    <h1 style="font-size:34px">My trip</h1>
  </div>
  <form class="t-card hidden" id="find-form" novalidate>
    <p style="margin:0">Enter your booking number and the phone number you booked with.</p>
    <div class="grid-2">
      <label class="field">Booking number<input type="text" name="ref" placeholder="VS-XXXXXX" autocapitalize="characters"></label>
      <label class="field">Phone number<input type="tel" name="phone" placeholder="07XX XXX XXX"></label>
    </div>
    <p class="error hidden" id="find-error" role="alert"></p>
    <div><button type="submit" class="btn btn-primary">Find my trip</button></div>
  </form>
  <div id="trip-view" class="stack-sm hidden" style="gap:16px"></div>
</main>
<footer id="site-footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
